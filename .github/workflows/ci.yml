name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The test suite needs KiCad's symbol libraries and kicad-cli, which the runner does not have.
      # Type-check and build here; run "npm test" locally.
      - run: npm run typecheck
      - run: npm run build
